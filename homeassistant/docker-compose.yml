---
# MANAGED IN GIT, DO NOT EDIT IN PORTAINER
services:
  homeassistant:
    image: linuxserver/homeassistant:2026.9.1
    container_name: homeassistant
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - DOCKER_MODS=linuxserver/mods:homeassistant-hacs
    volumes:
      - ${CONFIG_DIR}:/config
      - ${MEDIA_DIR}:/config/media
    ports:
      - 8123:8123
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    restart: always
