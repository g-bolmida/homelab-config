---
services:
  sonarr:
    image: linuxserver/sonarr:4.0.17
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${CONFIG_DIR}:/config
      - /mnt/media-dir:/data
    networks:
      teleport_teleport:
    restart: unless-stopped

networks:
  teleport_teleport:
    external: true
