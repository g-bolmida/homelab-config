---
services:
  sonarr:
    image: linuxserver/sonarr:4.0.16
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${CONFIG_DIR}:/config
      - media-drive:/data
    networks:
      teleport:
    restart: unless-stopped

networks:
  teleport:
    external: true

volumes:
  media-drive:
    external: true
    name: media-drive
