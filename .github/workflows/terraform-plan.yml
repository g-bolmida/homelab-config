---
name: Terraform Plan
# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]

jobs:
  terraform-plan:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_VAR_portainer_api_key: ${{ secrets.TF_VAR_PORTAINER_API_KEY }}
      TF_VAR_b2_application_key_id: ${{ secrets.TF_VAR_B2_APPLICATION_KEY_ID }}
      TF_VAR_b2_application_key: ${{ secrets.TF_VAR_B2_APPLICATION_KEY }}
      TF_VAR_linode_api_token: ${{ secrets.TF_VAR_LINODE_API_TOKEN }}
      TF_VAR_linode_root_password: ${{ secrets.TF_VAR_LINODE_ROOT_PASSWORD }}
      TF_VAR_plex_claim: ${{ secrets.TF_VAR_PLEX_CLAIM }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color 2>&1 | tee validate.txt
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const validate = fs.readFileSync('validate.txt', 'utf8');

            const output = `#### Terraform Format and Style 🖌` +
              `\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️` +
              `\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖` +
              `\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`
            ${validate}
            \`\`\`

            </details>

            #### Terraform Plan 📖` +
              `\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}*
            *Action: \`${{ github.event_name }}\`*
            *Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
