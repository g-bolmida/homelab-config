---
name: Terraform Apply
# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]

jobs:
  terraform-apply:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_VAR_portainer_api_key: ${{ secrets.TF_VAR_PORTAINER_API_KEY }}
      TF_VAR_b2_application_key_id: ${{ secrets.TF_VAR_B2_APPLICATION_KEY_ID }}
      TF_VAR_b2_application_key: ${{ secrets.TF_VAR_B2_APPLICATION_KEY }}
      TF_VAR_linode_api_token: ${{ secrets.TF_VAR_LINODE_API_TOKEN }}
      TF_VAR_linode_root_password: ${{ secrets.TF_VAR_LINODE_ROOT_PASSWORD }}
      TF_VAR_plex_claim: ${{ secrets.TF_VAR_PLEX_CLAIM }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -no-color 2>&1 | tee apply.txt

      - name: Post Apply Summary
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let apply = 'Apply output not available';
            try {
              if (fs.existsSync('apply.txt')) {
                apply = fs.readFileSync('apply.txt', 'utf8');
              }
            } catch (e) {
              console.log('Could not read apply.txt:', e.message);
            }

            const status = '${{ steps.apply.outcome }}' === 'success' ?
              '✅ **SUCCESS**' : '❌ **FAILED**';

            const output = `## Terraform Apply ${status}

            **Commit:** ${{ github.sha }}
            **Pusher:** @${{ github.actor }}
            **Workflow:** \`${{ github.workflow }}\`

            <details><summary>Show Apply Output</summary>

            \`\`\`terraform
            ${apply}
            \`\`\`

            </details>`;

            // Create issue comment on the most recent merged PR
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              per_page: 1
            });

            if (commits.data[0]?.commit?.message) {
              const prMatch = commits.data[0].commit.message.match(/#(\d+)/);
              if (prMatch) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(prMatch[1]),
                  body: output
                });
              }
            }
