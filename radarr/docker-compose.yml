---
services:
  radarr:
    image: linuxserver/radarr:6.0.4
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${CONFIG_DIR}:/config
      - /mnt/media-dir:/data
    networks:
      teleport:
    restart: unless-stopped

networks:
  teleport:
    external: true
