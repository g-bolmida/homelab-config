---
# MANAGED IN GIT, DO NOT EDIT IN PORTAINER
services:
  radarr:
    image: linuxserver/radarr:6.2.1
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${CONFIG_DIR}:/config
      - /mnt/media-dir:/data
    networks:
      teleport_teleport:
    restart: unless-stopped

networks:
  teleport_teleport:
    external: true
